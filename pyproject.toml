[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
# Start with correctness rules only; widen gradually (I, B, UP, S) once the baseline is clean.
select = ["E9", "F"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

