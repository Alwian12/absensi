<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Instansi - Monitoring PKL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="/dashboard">Monitoring PKL</a>
      </div>
    </nav>
    <div class="container py-4">
      <h2 class="mb-4">Data Instansi</h2>
      <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
          <h5>Tambah Instansi</h5>
          <form method="post" class="row g-2">
            <div class="col-md-4"><input class="form-control" name="nama_instansi" placeholder="Nama instansi" required></div>
            <div class="col-md-4"><input class="form-control" name="alamat" placeholder="Alamat"></div>
            <div class="col-md-2"><input class="form-control" name="kontak" placeholder="Kontak"></div>
            <div class="col-md-2"><button class="btn btn-primary w-100">Simpan</button></div>
          </form>
        </div>
      </div>
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <table class="table table-striped">
            <thead><tr><th>#</th><th>Nama Instansi</th><th>Alamat</th><th>Kontak</th></tr></thead>
            <tbody>
              {% for institution in institutions %}
              <tr><td>{{ institution.id }}</td><td>{{ institution.nama_instansi }}</td><td>{{ institution.alamat }}</td><td>{{ institution.kontak }}</td></tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
