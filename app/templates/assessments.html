<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Penilaian - Monitoring PKL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="/dashboard">Monitoring PKL</a>
      </div>
    </nav>
    <div class="container py-4">
      <h2 class="mb-4">Penilaian Peserta</h2>
      <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
          <h5>Tambah Nilai</h5>
          <form method="post" class="row g-2">
            <div class="col-md-3">
              <select class="form-select" name="user_id">
                {% for participant in participants %}
                <option value="{{ participant.user_id }}">{{ participant.nama_lengkap }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-2"><input class="form-control" name="nilai" type="number" placeholder="Nilai" required></div>
            <div class="col-md-5"><input class="form-control" name="catatan" placeholder="Catatan"></div>
            <div class="col-md-2"><button class="btn btn-primary w-100">Simpan</button></div>
          </form>
        </div>
      </div>
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <table class="table table-striped">
            <thead><tr><th>#</th><th>User</th><th>Nilai</th><th>Catatan</th></tr></thead>
            <tbody>
              {% for assessment in assessments %}
              <tr><td>{{ assessment.id }}</td><td>{{ assessment.user_id }}</td><td>{{ assessment.nilai }}</td><td>{{ assessment.catatan }}</td></tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
