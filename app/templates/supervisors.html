<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pembimbing - Monitoring PKL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="/dashboard">Monitoring PKL</a>
      </div>
    </nav>
    <div class="container py-4">
      <h2 class="mb-4">Data Pembimbing</h2>
      <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
          <h5>Tambah Pembimbing</h5>
          <form method="post" class="row g-2">
            <div class="col-md-4"><input class="form-control" name="nama_lengkap" placeholder="Nama lengkap" required></div>
            <div class="col-md-3"><input class="form-control" name="bidang" placeholder="Bidang"></div>
            <div class="col-md-3">
              <select class="form-select" name="user_id">
                {% for user in users %}
                <option value="{{ user.id }}">{{ user.username }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-2"><button class="btn btn-primary w-100">Simpan</button></div>
          </form>
        </div>
      </div>
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <table class="table table-striped">
            <thead><tr><th>#</th><th>Nama</th><th>Bidang</th></tr></thead>
            <tbody>
              {% for supervisor in supervisors %}
              <tr><td>{{ supervisor.id }}</td><td>{{ supervisor.nama_lengkap }}</td><td>{{ supervisor.bidang }}</td></tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
